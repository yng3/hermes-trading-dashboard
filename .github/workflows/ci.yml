name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install backend test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Backend tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Backend lint and types
        run: |
          ruff check backend/dashboard/plugin_api.py tests/test_plugin_api.py
          ruff format --check backend/dashboard/plugin_api.py tests/test_plugin_api.py
          pyright backend/dashboard/plugin_api.py tests/test_plugin_api.py
      - name: Frontend syntax
        run: node --check plugin.js
      - name: Frontend smoke and state matrix
        run: node tests/smoke_plugin.mjs
